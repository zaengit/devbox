[workspace]
resolver = "2"
members = [
    "crates/devbox-core",
    "crates/devbox-icons",
    "crates/devbox-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/devbox-project/devbox"

[workspace.dependencies]
anyhow = "1.0"
futures = "0.3"
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process"] }
regex = "1.11"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }

